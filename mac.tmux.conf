bind -n S-Left  previous-window
bind -n S-Right next-window
set -g pane-border-status top
set -g pane-border-format "#{pane_title}"

set -g mouse on
setw -g mode-keys vi

# clipboard over mosh: mosh only accepts OSC 52 with a `c;` target,
# so force `c` in Ms; :clipboard lets programs inside tmux push too
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c%p1%.0s;%p2%s\7'
#set -as terminal-features ',*:clipboard'
#set -as terminal-overrides ',*:Ms=\E]52;c%p1%.0s;%p2%s\7'
set -g copy-command 'ssh mac pbcopy' # just pbcopy on mac

# Copy but stay in copy-mode, so scrollback doesn't snap to the prompt.
# copy-pipe-no-clear (no arg) still pipes through copy-command (pbcopy).
# Press q or Escape to leave copy-mode when done.
# bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane  send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane  send -X select-line \; send -X copy-pipe-no-clear
bind -T root DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear
bind -T root TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear