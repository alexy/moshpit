bind -n S-Left  previous-window
bind -n S-Right next-window

set -g pane-border-status top
set -g pane-border-format "#{pane_title}"
set -g set-clipboard on

set -g mouse on
setw -g mode-keys vi

# Mouse drag-release → copy to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# vi 'y' in copy-mode → macOS clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Enter (in copy-mode) → macOS clipboard too
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Double-click a word → clipboard
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T root DoubleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple-click a line → clipboard
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T root TripleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
